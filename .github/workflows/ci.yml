name: CI
# Runs natively on GitHub Actions. Every push to any branch gets a run, so a
# push to a PR branch always produces a signal (libviprs/libviprs#585).
#
# No job names a dependency directory. `pdfium/` was hardcoded into every
# step here, which meant a second dependency landed completely unchecked
# until someone noticed; the paths are now discovered from the tree, so
# the next one is covered the day it lands.
on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      # ruff walks the whole repo and honours .gitignore, so every
      # dependency's Python is linted without listing any of them.
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # pyyaml is not a test dependency of this repo's own suite, but
      # pdfium/tests/test_release_workflow.py `importorskip`s it — without
      # it those 13 tests skipped on every CI run while looking green.
      - run: pip install pytest pyyaml
      # Collection is repo-wide (pyproject.toml sets no testpaths), so
      # every */tests directory runs. pytest exits 5 when it collects
      # nothing, so a discovery regression fails the job rather than
      # passing vacuously.
      #
      # This run is strict about compiled fixtures, and nothing below sets
      # it. Six suites compile a stand-in library before they assert
      # anything, and on a host without a compiler all of them skip, which
      # is 114 tests reading as a pass. acadsharp/tests/toolchain.py turns
      # a missing build tool into a failure whenever CI is present, and
      # Actions sets CI on every runner, so the strictness is derived here
      # rather than configured here. That is deliberate: the flag above
      # about pyyaml is in this file because somebody had to remember it,
      # and a flag that has to be remembered is the failure mode both of
      # these are about. VIPRS_REQUIRE_COMPILED_FIXTURES overrides the
      # derivation in both directions, so a runner image that genuinely
      # ships no compiler sets it to 0, here, with a note saying which
      # runner and why.
      - run: pytest -v

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # One command rather than an inline block, so the shared pre-commit
      # hook in libviprs-tests can mirror it exactly. Its guard cannot
      # stand in for a multi-line block, and a step it cannot mirror is a
      # step the local hook stops running.
      - run: tools/shellcheck-all.sh
