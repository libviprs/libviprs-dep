name: CI
# Runs natively on GitHub Actions. Every push to any branch gets a run, so a
# push to a PR branch always produces a signal (libviprs/libviprs#585).
#
# No job names a dependency directory. `pdfium/` was hardcoded into every
# step here, which meant a second dependency landed completely unchecked
# until someone noticed; the paths are now discovered from the tree, so
# the next one is covered the day it lands.
on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      # ruff walks the whole repo and honours .gitignore, so every
      # dependency's Python is linted without listing any of them.
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # pyyaml is not a test dependency of this repo's own suite, but
      # pdfium/tests/test_release_workflow.py `importorskip`s it — without
      # it those 13 tests skipped on every CI run while looking green.
      - run: pip install pytest pyyaml
      # Collection is repo-wide (pyproject.toml sets no testpaths), so
      # every */tests directory runs. pytest exits 5 when it collects
      # nothing, so a discovery regression fails the job rather than
      # passing vacuously.
      - run: pytest -v

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck every tracked shell script
        run: |
          set -euo pipefail
          scripts=$(git ls-files '*.sh')
          if [ -z "$scripts" ]; then
            echo "no shell scripts found — script discovery is broken" >&2
            exit 1
          fi
          echo "$scripts"
          echo "$scripts" | xargs shellcheck
