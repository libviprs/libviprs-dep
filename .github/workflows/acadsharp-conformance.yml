name: acadsharp conformance

# The evidence, run.
#
# Everything under acadsharp/tests that checks behaviour reads a committed
# capture, because pytest here has no .NET and is not getting one (ADR 0001).
# The two things that do execute the boundary are the C conformance consumer
# and the generated Rust one, and until this file nothing ran either: ci.yml
# never mentions them, and release-acadsharp.yml checks that the exported
# symbols are present and never calls one. So a large, careful suite was
# measuring a build nobody could prove still existed.
#
# A file of its own rather than a job in ci.yml, and that is not a style
# choice. libviprs-tests' `Hook Mirror (every repo in the org)` job reads this
# repo's ci.yml at the main tip and mirrors every job there into the shared
# pre-commit hook unless it is listed as deferred, so a job added to ci.yml
# reddens that repo until a pairing PR merges, and a .NET SDK is not something
# a pre-commit hook should need. That guard reads ci.yml only, and so does
# zstd/tests/test_ci_coverage.py's refusal to hardcode a dependency directory,
# which matters because everything below names acadsharp/ on purpose: this
# workflow is about one dependency, and gating it on that dependency's paths
# is what keeps it cheap. ADR 0001 said a separate file was the cheaper way in
# once there was an artifact to verify. There is one now.
#
# The first run is against the archive rather than the build tree, because the
# premise of the epic is that a consumer links what we publish, so what is
# worth proving still behaves is what we publish. The second is against the
# test configuration, which is the only build carrying the exports that make
# the exception and handle-leak cases runnable at all, and which had stopped
# compiling on main without anything saying so.
#
# The third is the same argument one libc over. #73 gave musl a link test and
# a runtime probe and no consumer run at all, so the musl archive shipped a
# shared library nothing had ever asked to answer the ABI handshake. It gets
# one run per consumer, against the archive, in an Alpine container of this
# same architecture, and deliberately not a second AbiTest publish: the
# question musl can answer differently is whether the .so loads and answers,
# and the exception and handle-leak cases are managed logic that cannot
# differ by libc.

on:
  push:
    paths:
      - 'acadsharp/**'
      - '.github/workflows/acadsharp-conformance.yml'
  workflow_dispatch:

concurrency:
  # One run per ref is enough, and a superseded one is not worth a runner.
  group: acadsharp-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consumers:
    # Native arm64, no emulation, the same rule release-acadsharp.yml follows:
    # ADR 0001 measured a cross-architecture publish producing the object file
    # and then failing at the native link, and .NET documents qemu-user-static
    # as unsupported.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      # The runners' default is a local image name that exists on one machine.
      # CI has to name something a registry can serve, and the runners take it
      # from the environment for exactly this.
      VIPRS_CONFORMANCE_IMAGE: rust:1.98.1
      VIPRS_CONFORMANCE_PLATFORM: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the linux/arm64 archive
        # No --version: the driver reads acadsharp/VERSION, which is what a
        # push to a branch is asking about.
        run: python3 acadsharp/build_acadsharp.py --platform linux --arch arm64

      - name: Verify the archive before anything runs against it
        # Named, not globbed: a glob that matches nothing verifies nothing and
        # still exits 0.
        run: |
          bash acadsharp/scripts/verify_archive.sh \
            bin/acadsharp-linux-arm64.tgz linux arm64

      - name: Unpack it the way a consumer would
        run: |
          set -eu
          mkdir -p bin/unpacked
          tar -xzf bin/acadsharp-linux-arm64.tgz -C bin/unpacked
          find bin/unpacked -maxdepth 2

      - name: Run the C consumer against the unpacked archive
        env:
          VIPRS_LIB_DIR: ${{ github.workspace }}/bin/unpacked/acadsharp-linux-arm64
        run: acadsharp/tests/conformance/c/run.sh

      - name: Run the generated Rust consumer against the unpacked archive
        env:
          VIPRS_LIB_DIR: ${{ github.workspace }}/bin/unpacked/acadsharp-linux-arm64
        run: acadsharp/tests/conformance/rust/run.sh

      - name: Name the builder image the archive build left behind
        id: builder
        # Asked of the driver rather than spelled out here. The tag is
        # assembled from the version and the cell, and a copy of that rule in
        # this file is a copy that goes stale on the first bump.
        run: |
          set -eu
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import importlib.util

          spec = importlib.util.spec_from_file_location(
              "build_acadsharp", "acadsharp/build_acadsharp.py"
          )
          driver = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(driver)
          print(f"image={driver.builder_image_tag(driver.read_version(), 'linux', 'arm64')}")
          PY
          cat "$GITHUB_OUTPUT"

      - name: Replay every committed expectation through the shim in the tree
        # The step this whole workflow was missing, and the one that makes
        # every adapter test under acadsharp/tests mean something.
        #
        # pytest has no .NET (ADR 0001), so what it reads is a committed dump
        # of a decode somebody ran once. MANIFEST.json carries the sha256 of
        # every source the generator compiles and test_shim_digest.py
        # recomputes it, which turns an edited flattener into a red test. That
        # is a staleness alarm, not evidence, and it is forgeable in four
        # lines: the manifest's shim block is computed from the source tree
        # with the same helpers the test verifies it with, so rewriting it
        # puts the whole suite back to exactly its old colour over
        # expectations that record behaviour the shim no longer has. Measured,
        # not argued: with #82's refusal applied and the block rewritten,
        # test_shim_digest.py and test_adapter_stream.py were 477 green.
        #
        # Neither consumer below closes it. Both drive SyntheticSource through
        # open_memory, so neither opens a fixture or reads an expectation, and
        # until this step nothing on any runner decoded a single committed
        # DWG.
        #
        # This does, every one of them, in the image the archive build just
        # made, which already holds the SDK and the patched upstream checkout.
        # It costs one Debug build of the generator and about nine seconds of
        # replay, measured, and the same mutation it was written against names
        # real_AC1018 and real_AC1032 with the first differing record printed
        # under each.
        #
        # Ahead of the AbiTest publish on purpose: it is the cheaper half and
        # a stale expectation is worth hearing about before a second NativeAOT
        # build runs.
        env:
          BUILDER: ${{ steps.builder.outputs.image }}
        run: |
          python3 acadsharp/tests/fixtures/gen/replay.py \
            --image "$BUILDER" --platform "$VIPRS_CONFORMANCE_PLATFORM"

      - name: Publish the test configuration in that image
        # The AbiTest configuration is Release plus the two exports that let a
        # consumer make the library throw and read its live handle count, so
        # it is the only build against which the exception cases and the
        # handle-leak cases can run at all. Nothing publishes it, which is how
        # main came to carry a duplicate entry point that made it stop
        # compiling while every green check stayed green.
        #
        # It builds in the image the archive build just made, which already
        # holds the SDK, clang, the pinned upstream source and a warm package
        # cache, so this costs one publish and no downloads. The sources come
        # from the checkout rather than from the copy baked into the image, so
        # what runs is what was pushed.
        env:
          BUILDER: ${{ steps.builder.outputs.image }}
        run: |
          set -eu
          mkdir -p bin/abitest
          docker run --rm --platform linux/arm64 \
            -v "$PWD/acadsharp":/acadsharp:ro \
            -v "$PWD/bin/abitest":/out \
            --entrypoint sh "$BUILDER" -c '
              set -eu
              cp -r /acadsharp /tmp/acadsharp
              cd /tmp/acadsharp/native
              project=$(ls -d /build/ACadSharp-*/src/ACadSharp/ACadSharp.csproj)
              dotnet publish Viprs.ACadSharp.Native.csproj \
                  -r linux-arm64 -c AbiTest \
                  -p:AcadSharpProject="$project" \
                  --artifacts-path /tmp/art \
                  > /tmp/publish-abitest.log 2>&1 \
                || { tail -60 /tmp/publish-abitest.log; exit 1; }
              library=$(find /tmp/art -path "*publish*" -name viprs_acadsharp.so | head -1)
              [ -n "$library" ] || { echo "the publish produced no library" >&2; exit 1; }
              cp "$library" /out/
              chmod a+r /out/viprs_acadsharp.so
            '

      - name: Run the C consumer against the test configuration
        env:
          VIPRS_LIB_DIR: ${{ github.workspace }}/bin/abitest
        run: acadsharp/tests/conformance/c/run.sh

      - name: Run the generated Rust consumer against the test configuration
        env:
          VIPRS_LIB_DIR: ${{ github.workspace }}/bin/abitest
        run: acadsharp/tests/conformance/rust/run.sh

      - name: Keep the build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-conformance
          path: bin/logs/
          if-no-files-found: warn

  musl-static-link:
    # The musl half of the same premise, and the one nothing covered. It
    # links, and since #74 it also runs: the consumers at the end of this job
    # are the first thing that ever asked a musl build of the shim to answer
    # for itself rather than merely to resolve at a link.
    #
    # verify_archive.sh holds `static_certified: true` to an archive that
    # links and runs, but only when the host can build for the target.
    # Every musl cell in release-acadsharp.yml runs on a glibc runner, so
    # what those cells got was
    #
    #   static_certified: not link-tested (this host cannot build for musl/x64)
    #
    # written into a log, and a green job. Both musl archives shipped a
    # documented cargo recipe that had never once been run, and when it
    # was finally run it failed: the runtime bundles its own
    # llvm-libunwind and rustc links a self-contained one for every musl
    # target, so about sixty symbols collide at the link. The build now
    # renames ours, and this is the job that finds out on a pull request
    # rather than at release time.
    #
    # A job of its own rather than more steps in `consumers`, because it
    # is a second NativeAOT build and serialising them puts two of those
    # inside one 90 minute budget.
    #
    # arm64, on a native arm64 runner, for the reason ADR 0001 gives:
    # .NET documents qemu-user-static as unsupported and a
    # cross-architecture publish was measured producing the object file
    # and then failing at the native link. The x64 musl cell is covered
    # by the same wrapper in release-acadsharp.yml, on an x64 runner.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      # The same image one libc over, and that is the point of pinning it
      # here rather than picking whatever Alpine has rust on it. If the two
      # jobs also differed by compiler version, a check that passes on glibc
      # and fails on musl would no longer say which of the two it was.
      VIPRS_CONFORMANCE_IMAGE: rust:1.98.1-alpine
      VIPRS_CONFORMANCE_PLATFORM: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the musl/arm64 archive
        run: python3 acadsharp/build_acadsharp.py --platform musl --arch arm64

      - name: Verify it on a musl host
        # The wrapper, not the verifier. This runner is glibc, so calling
        # verify_archive.sh here reproduces exactly the skip that let the
        # broken recipe ship. The wrapper puts the archive in front of an
        # Alpine container of this same architecture, where the script's
        # own musl detection fires and cc, cargo and rustc are all
        # musl-native, and it sets VIPRS_REQUIRE_LINK_TEST so a skip is a
        # failure rather than a line in a log.
        run: |
          bash acadsharp/scripts/verify_archive_matched_host.sh \
            bin/acadsharp-musl-arm64.tgz musl arm64

      - name: Unpack it the way a consumer would
        run: |
          set -eu
          mkdir -p bin/unpacked-musl
          tar -xzf bin/acadsharp-musl-arm64.tgz -C bin/unpacked-musl
          find bin/unpacked-musl -maxdepth 2

      - name: Name the libc the library asks for
        # The positive control for the two runs below, and they need one. A
        # musl .so and a glibc .so are both ELF, both get found by the same
        # find_shim.sh, and a consumer linked against either reports the same
        # passes, so a green run underneath this does not on its own say which
        # library it ran against. This does: NEEDED is the library's own
        # statement about its libc, written by the linker that built it, and a
        # glibc build of the same shim says libc.so.6 here.
        #
        # The decision moved into expect_libc.sh when #74 needed the same
        # control in release-acadsharp.yml. Two copies of a guard drift, and
        # the copy that lives inside a workflow is the one no test can run:
        # this one was correct and had never been shown to refuse anything.
        # test_conformance_workflow.py now runs it both ways.
        env:
          VIPRS_LIB_DIR: ${{ github.workspace }}/bin/unpacked-musl/acadsharp-musl-arm64
        run: |
          set -eu
          library=$(acadsharp/tests/conformance/find_shim.sh "$VIPRS_LIB_DIR")
          echo "library: $library"
          needed=$(docker run --rm --platform "$VIPRS_CONFORMANCE_PLATFORM" \
            -v "$PWD":"$PWD" "$VIPRS_CONFORMANCE_IMAGE" \
            readelf -d "$library" | sed -n 's/.*NEEDED.*\[\(.*\)\]/\1/p')
          printf '%s\n' "$needed" \
            | acadsharp/tests/conformance/expect_libc.sh musl

      - name: Run the C consumer against the unpacked musl archive
        # One run per consumer on this side, against the archive, and no
        # second AbiTest publish. The musl-specific question is whether the
        # .so loads and answers the ABI handshake at all; viprs_acad__test_throw
        # and viprs_acad__test_live_handles exercise managed logic that cannot
        # differ by libc, so a musl AbiTest publish would cost a second
        # NativeAOT build for no musl-specific answer. The runners see the
        # exports are absent and skip those sections rather than failing.
        env:
          VIPRS_LIB_DIR: ${{ github.workspace }}/bin/unpacked-musl/acadsharp-musl-arm64
        run: acadsharp/tests/conformance/c/run.sh

      - name: Run the generated Rust consumer against the unpacked musl archive
        env:
          VIPRS_LIB_DIR: ${{ github.workspace }}/bin/unpacked-musl/acadsharp-musl-arm64
        run: acadsharp/tests/conformance/rust/run.sh

      - name: Keep the build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-conformance-musl
          path: bin/logs/
          if-no-files-found: warn
