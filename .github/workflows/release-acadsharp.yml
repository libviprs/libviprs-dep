name: Release acadsharp

# Publishes every archive build_acadsharp.py knows how to make to the
# acadsharp-<version> GitHub Release. A file of its own rather than a
# branch inside release.yml, which is pdfium-shaped end to end (chromium
# branch input, a lipo'd universal job, its own summary table), and
# because an acadsharp flake should not colour a pdfium release run red.
# release-zstd.yml exists for the same reason and this is its shape:
# resolve-version, a preflight that refuses an unpinned version before
# anything builds, create-release up front so the fan-out never races on
# `gh release create`, then build, verify, upload per cell.
#
# One thing is deliberately not copied from release-zstd.yml. That
# workflow registers an emulator and builds foreign-architecture cells
# under it. ADR 0001 measured cross-compiling here: ILC produced the
# object file and the native link then failed with `unrecognised
# emulation mode: aarch64linux`, and the .NET runtime documents
# qemu-user-static as unsupported. So every cell below runs on a runner
# of its own architecture, and acadsharp/tests/test_release_workflow.py
# refuses an emulator if anyone reintroduces one.
#
# The notes are generated, never typed. Every number in them is read out
# of a manifest in the tree or out of a published archive's
# metadata/LINKINFO.json, so bumping a pin cannot leave the release page
# claiming the old value.

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      version:
        description: "acadsharp version to publish (overrides acadsharp/VERSION)"
        required: false

concurrency:
  # Two overlapping runs would race on the same tag's assets. Serialize
  # per ref, and don't cancel: a release that is halfway through five
  # uploads is worth finishing.
  group: release-acadsharp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-version:
    # Everything that can be refused cheaply is refused here, in the job
    # every other job waits on, so a bad pin dies once rather than five
    # times on five claimed runners. No `permissions:` block: this job
    # publishes nothing and has no business holding a token that could.
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve acadsharp version
        id: v
        # The dispatch input arrives through `env:` rather than being
        # interpolated into the script. A `${{ }}` spliced straight into
        # bash is the shape that turns a workflow input into shell, and
        # release-zstd.yml had to be fixed for exactly that.
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          set -eu
          if [ -n "$REQUESTED" ]; then
            V="$REQUESTED"
          else
            V="$(tr -d '[:space:]' < acadsharp/VERSION)"
          fi
          [ -n "$V" ] || { echo "acadsharp/VERSION is empty" >&2; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=acadsharp-$V" >> "$GITHUB_OUTPUT"

      - name: Refuse a version the driver has no pinned source for
        # Three refusals in one step, all asked of the driver rather than
        # re-implemented here. split_version rejects an empty or
        # malformed VERSION; source_sha256 rejects a bump whose upstream
        # half has no SOURCE_SHA256 entry, which would otherwise mean
        # downloading whatever GitHub serves that day; and
        # packaged_shim_digest rejects a tree that is not the shim this
        # version claims to be.
        #
        # That last one is refused twice on purpose. `linkinfo_skeleton`
        # asks it again in every build job, because that is where the
        # manifest is written and a check somewhere else can be skipped.
        # But by then five runners have compiled a library for nothing, and
        # the case it catches is the ordinary one: a dispatch naming a
        # published version on a tree whose shim has moved since. The
        # digest needs no .NET, no network and no runner of any particular
        # architecture -- it is a walk over `native/*.cs` -- so there is no
        # reason for it to cost a build.
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -eu
          python3 - "$VERSION" <<'PY'
          import importlib.util
          import sys

          spec = importlib.util.spec_from_file_location(
              "build_acadsharp", "acadsharp/build_acadsharp.py"
          )
          driver = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(driver)

          try:
              upstream, shim = driver.split_version(sys.argv[1])
          except ValueError as exc:
              sys.exit(str(exc))
          try:
              digest = driver.source_sha256(upstream)
          except (KeyError, ValueError) as exc:
              sys.exit(str(exc).strip("'"))
          try:
              packaged = driver.packaged_shim_digest(sys.argv[1])
          except ValueError as exc:
              sys.exit(str(exc))
          print(f"ACadSharp {upstream}, shim revision {shim}")
          print(f"pinned sha256: {digest}")
          print(f"shim sha256:   {packaged}")
          PY

      - name: Refuse a global.json with no SDK pin
        # actions/setup-dotnet below reads this file, but a global.json
        # that names no sdk.version is not something it fails loudly on,
        # and the five build jobs would each discover the missing pin for
        # themselves. Ask the question once, here.
        run: |
          set -eu
          python3 - <<'PY'
          import json
          import sys

          path = "acadsharp/native/global.json"
          with open(path) as f:
              pinned = json.load(f)
          version = pinned.get("sdk", {}).get("version")
          if not version:
              sys.exit(
                  f"{path} names no sdk.version. The SDK pin is what makes a build "
                  "reproducible, so an absent one is an error and not a default."
              )
          print(f"pinned SDK: {version}")
          PY

      - name: Prove the pinned SDK is installable
        # The pin is read from global.json rather than repeated here, so
        # an SDK that has aged out of the runner images fails in this job
        # instead of in every build job at once.
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: acadsharp/native/global.json

  create-release:
    # Created up front so the fan-out jobs never race on `gh release
    # create`. Re-running is safe: an existing tag is left alone and the
    # uploads below use --clobber.
    needs: resolve-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate the release notes preamble
        # Everything here is read out of a manifest. Nothing about the
        # version or the SDK is typed into this file, so bumping a pin
        # cannot leave the release page stating the old one. The
        # per-target table is appended by release-notes once the archives
        # exist, because static_certified and each archive's digest only
        # exist after a build. The DWG read range is appended there too:
        # it is measured off each library during its own build, so at
        # this point in the run nothing has been asked yet.
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -eu
          python3 - "$VERSION" > release-notes.md <<'PY'
          import importlib.util
          import json
          import re
          import sys

          version = sys.argv[1]

          spec = importlib.util.spec_from_file_location(
              "build_acadsharp", "acadsharp/build_acadsharp.py"
          )
          driver = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(driver)
          upstream, shim = driver.split_version(version)

          with open("acadsharp/native/global.json") as f:
              sdk = json.load(f)["sdk"]["version"]

          with open("acadsharp/include/viprs_acadsharp.h") as f:
              header = f.read()
          abi = re.search(r"VIPRS_ACAD_ABI_VERSION\s+(\d+)u", header)
          wire = re.search(r"VIPRS_ACAD_WIRE_VERSION\s+(\d+)u", header)

          print(f"ACadSharp {upstream} through the VIPRS NativeAOT shim, revision {shim}.")
          print()
          print("A plain C ABI over ACadSharp, published ahead of time, so a consumer")
          print("links a library and never learns the code started life as C#.")
          print()
          print(f"- ACadSharp release: `v{upstream}`")
          print(f"- Source: {driver.source_url(upstream)}")
          print(f"- Source sha256: `{driver.source_sha256(upstream)}`")
          print(f"- CSUtilities submodule: `{driver.CSUTILITIES_COMMIT}`")
          print(f"- .NET SDK: `{sdk}`")
          if abi and wire:
              print(f"- ABI version {abi.group(1)}, wire version {wire.group(1)}")
          print()
          print(
              "Generated from acadsharp/VERSION, acadsharp/native/global.json, "
              "acadsharp/include/viprs_acadsharp.h and acadsharp/build_acadsharp.py."
          )
          PY
          cat release-notes.md

      - name: Create or confirm release
        # No --prerelease. build_acadsharp.upload_release() creates a plain
        # release for this same tag, so marking it here would make the kind
        # of release depend on whether a laptop or this workflow cut it.
        # Neither release.yml nor release-zstd.yml marks one either, and a
        # pre-release is never "latest", which a consumer resolving the tag
        # by hand would trip over.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-version.outputs.tag }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -eu
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          # --target pins the tag to the commit that is actually being
          # built. Without it `gh release create` lets the API default
          # target_commitish to the default branch, so a dispatch from any
          # other ref builds that ref's code and tags main's head: every
          # archive right, the tag pointing at something that never
          # produced them.
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "acadsharp $VERSION" \
            --notes-file release-notes.md

      - name: Keep the preamble for the notes job
        # release-notes rewrites the body with the per-target table
        # appended. Handing it the preamble as an artifact means the
        # generator above exists once rather than in two `run:` blocks
        # that can drift.
        uses: actions/upload-artifact@v4
        with:
          name: release-notes-preamble
          path: release-notes.md
          if-no-files-found: error

  build-linux:
    # The four container cells. Each runs on a runner of its own
    # architecture: ADR 0001 measured the native link failing when the
    # host arch differs, and GitHub hosts arm64 runners for public
    # repositories, which this is. fail-fast is off so one cell flaking
    # does not discard three good archives.
    #
    # Each cell also carries the image its conformance consumers run in,
    # which is the same toolchain in the libc that cell builds for. The
    # pin is beside the cell rather than in one place above it because
    # the two are the same decision: a musl archive asks for
    # /lib/ld-musl-*.so.1 and a glibc container has no such loader, so a
    # cell whose image does not match its platform is a cell whose
    # consumers cannot load the library at all.
    needs: [resolve-version, create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux, cpu: x64, arch: amd64, runner: ubuntu-latest, image: rust:1.98.1 }
          - { platform: linux, cpu: arm64, arch: arm64, runner: ubuntu-24.04-arm, image: rust:1.98.1 }
          - { platform: musl, cpu: x64, arch: amd64, runner: ubuntu-latest, image: rust:1.98.1-alpine }
          - { platform: musl, cpu: arm64, arch: arm64, runner: ubuntu-24.04-arm, image: rust:1.98.1-alpine }
    runs-on: ${{ matrix.runner }}
    # 60 was the size of a job that built and verified. It now also runs
    # two consumers against what it built, so the ceiling moves with it
    # rather than staying where it was and turning a slow build into a
    # cancelled release.
    timeout-minutes: 75
    permissions:
      contents: write
    env:
      # The three the conformance runners read, and all three are
      # properties of the cell rather than of the job, so they are taken
      # from the matrix and not spelled out. Declared here rather than on
      # each of the three steps that needs them, because a copy per step
      # is three places for one cell's answer to drift.
      #
      # linux/${{ matrix.arch }} is not a third vocabulary: --arch already
      # speaks amd64|arm64 to the driver, which is what docker's
      # --platform takes, so the cell that decides what is built decides
      # what runs it. --platform is never left off, in this repository
      # least of all: a developer's DOCKER_DEFAULT_PLATFORM has been both
      # values, and an architecture result from an unpinned run means
      # nothing.
      VIPRS_CONFORMANCE_IMAGE: ${{ matrix.image }}
      VIPRS_CONFORMANCE_PLATFORM: linux/${{ matrix.arch }}
      VIPRS_LIB_DIR: ${{ github.workspace }}/bin/unpacked/acadsharp-${{ matrix.platform }}-${{ matrix.cpu }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build ${{ matrix.platform }}/${{ matrix.cpu }}
        # --arch, not --cpu. The driver speaks amd64/arm64 at the CLI,
        # like build_zstd.py and build_pdfium.py before it, while the
        # archive name and the verifier's third argument speak x64/arm64.
        # Each cell carries both rather than leaning on the driver's
        # ARCH_ALIASES to paper over the difference, so the two
        # vocabularies stay visible and a mismatched cell is a thing a
        # test can see.
        #
        # No --upload. The driver can publish by itself, and doing that
        # here would put the archive on the release page before the
        # verifier had looked at it, which makes the verification
        # decorative. The upload is a step of its own, below Verify.
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          python3 acadsharp/build_acadsharp.py \
            --version "$VERSION" \
            --platform ${{ matrix.platform }} \
            --arch ${{ matrix.arch }}

      - name: Verify the ${{ matrix.platform }}/${{ matrix.cpu }} archive
        # Named rather than globbed on purpose: a glob that matches
        # nothing verifies nothing and still exits 0, which is a pass
        # reported for a check that never ran. The platform and cpu go in
        # too, so a cell that built the wrong target is caught instead of
        # the verifier believing whatever filename it was handed.
        #
        # Through verify_archive_matched_host.sh rather than straight at
        # verify_archive.sh. Both musl cells run on glibc runners, and
        # verify_archive.sh holds `static_certified` to a real link only
        # when the host can build for the target, so what those two cells
        # got instead was a "not link-tested" line in a log and a green
        # job. Two musl archives shipped a cargo recipe nothing had run.
        # The wrapper puts a musl archive in front of a musl host, in an
        # Alpine container on this same runner, and sets
        # VIPRS_REQUIRE_LINK_TEST so a cell that somehow still ends up
        # unable to link says so.
        run: |
          bash acadsharp/scripts/verify_archive_matched_host.sh \
            "bin/acadsharp-${{ matrix.platform }}-${{ matrix.cpu }}.tgz" \
            ${{ matrix.platform }} ${{ matrix.cpu }}

      - name: Unpack it the way a consumer would
        # Everything below runs against the tarball that is about to be
        # uploaded rather than against the build tree beside it, because
        # the premise of the epic is that a consumer links what we
        # publish and the build tree is not what anybody downloads.
        run: |
          set -eu
          mkdir -p bin/unpacked
          tar -xzf "bin/acadsharp-${{ matrix.platform }}-${{ matrix.cpu }}.tgz" \
            -C bin/unpacked
          find bin/unpacked -maxdepth 2

      - name: Name the libc the library asks for
        # The positive control for the two runs below, and they need one.
        # A musl .so and a glibc .so are both ELF, find_shim.sh finds
        # either, and a consumer linked against either reports the same
        # passes, so a green run underneath this does not say which
        # library it ran against. NEEDED does: it is the library's own
        # statement about its libc, written by the linker that built it.
        #
        # readelf comes out of the cell's own image, because the readelf
        # that can read this library is the one of this architecture. The
        # decision is in expect_libc.sh rather than here, so it can be run
        # both ways by a test rather than only by a release.
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -eu
          library=$(acadsharp/tests/conformance/find_shim.sh "$VIPRS_LIB_DIR")
          echo "library: $library"
          needed=$(docker run --rm --platform "$VIPRS_CONFORMANCE_PLATFORM" \
            -v "$PWD":"$PWD" "$VIPRS_CONFORMANCE_IMAGE" \
            readelf -d "$library" | sed -n 's/.*NEEDED.*\[\(.*\)\]/\1/p')
          printf '%s\n' "$needed" \
            | acadsharp/tests/conformance/expect_libc.sh "$PLATFORM"

      - name: Run the C consumer against the unpacked archive
        # #75 put both consumers in front of a musl library, in
        # acadsharp-conformance.yml, which runs arm64 and nothing else on
        # purpose. musl/x64 is built here and nowhere else, so it came out
        # of that lane exactly as it went in: linked, statically probed by
        # the verifier through the matched-host wrapper, and never once
        # loaded as a shared library by anything that asks it a question.
        #
        # No `if:` narrowing this to that one cell. Once the steps are in
        # the job they cost a container start each, linux/x64 had the same
        # gap and nobody had named it, the two arm64 cells re-ask the
        # question against the archive that is about to be uploaded rather
        # than against a branch build, and a rule with no exception cannot
        # be got wrong by editing the matrix.
        #
        # Between Verify and Upload on purpose: a library that loads and
        # then refuses the ABI handshake keeps its archive off the release
        # page instead of explaining itself afterwards.
        run: acadsharp/tests/conformance/c/run.sh

      - name: Run the generated Rust consumer against the unpacked archive
        # The exception and handle-leak cases need viprs_acad__test_throw
        # and viprs_acad__test_live_handles, which only the AbiTest
        # configuration exports. Nothing publishes that configuration
        # here and nothing should: it is a second NativeAOT build per
        # cell for cases that exercise managed logic, and the runners see
        # the exports are absent and skip those sections. What this cell
        # is for is the part that is not managed logic, which is whether
        # the library this archive ships loads and answers at all.
        run: acadsharp/tests/conformance/rust/run.sh

      - name: Upload release asset ${{ matrix.platform }}/${{ matrix.cpu }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-version.outputs.tag }}
        run: |
          gh release upload "$TAG" \
            "bin/acadsharp-${{ matrix.platform }}-${{ matrix.cpu }}.tgz" --clobber

      - name: Keep the build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.platform }}-${{ matrix.cpu }}
          path: bin/logs/
          if-no-files-found: warn

  build-mac:
    # There is no macOS container image, so this one builds natively with
    # the SDK global.json pins installed onto the runner. macos-15 is
    # Apple Silicon, which is the only mac slice this repo ships.
    needs: [resolve-version, create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: mac, cpu: arm64, arch: arm64 }
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: acadsharp/native/global.json

      - name: Build ${{ matrix.platform }}/${{ matrix.cpu }}
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          python3 acadsharp/build_acadsharp.py \
            --version "$VERSION" \
            --platform ${{ matrix.platform }} \
            --arch ${{ matrix.arch }}

      - name: Verify the ${{ matrix.platform }}/${{ matrix.cpu }} archive
        # Through verify_archive_matched_host.sh, like the four linux
        # cells, and not because a mac archive ever needs a container:
        # this runner is the matched host, so the wrapper runs the script
        # straight through. What it adds is `VIPRS_REQUIRE_LINK_TEST=1`,
        # and on a shared-only archive that is now the difference between
        # a line in a log and a refusal. verify_archive.sh runs the
        # documented cargo recipe for a shared-only archive only when the
        # host matches, cargo is present and that flag is set; unset, it
        # says "cargo recipe not run" and exits 0. Calling the script
        # directly here left the one target where shared is the only link
        # mode with the recipe unrun, which is #95's shape.
        #
        # The platform and cpu go in explicitly, and the archive is named
        # rather than globbed: a glob that matches nothing verifies
        # nothing and still exits 0.
        run: |
          bash acadsharp/scripts/verify_archive_matched_host.sh \
            "bin/acadsharp-${{ matrix.platform }}-${{ matrix.cpu }}.tgz" \
            ${{ matrix.platform }} ${{ matrix.cpu }}

      - name: Unpack it the way a consumer would
        # The same step the linux cells have, for the same reason: what a
        # consumer downloads is the tarball, not the build tree beside it.
        run: |
          set -eu
          mkdir -p bin/unpacked
          tar -xzf "bin/acadsharp-${{ matrix.platform }}-${{ matrix.cpu }}.tgz" \
            -C bin/unpacked
          find bin/unpacked -maxdepth 2

      - name: Link the unpacked archive through the documented recipe
        # The step this lane did not have, and #95 is what it cost. This
        # cell built, verified and uploaded a mac archive that no consumer
        # could link, five times, and nothing here was wrong: the build's
        # shared smoke is `dlopen` on an absolute path, `dlopen` never
        # consults `LC_ID_DYLIB`, and the verifier's link-and-run probe is
        # gated on `static_certified`, which is false on mac and always
        # will be. On the one target where shared is the only link mode,
        # nothing linked anything.
        #
        # So: the cargo recipe MANUAL.md documents, against the tarball
        # that is about to be uploaded. It links the `.dylib` the ordinary
        # way, adds the rpath the mac paragraph of docs/LINKINFO.md calls
        # for, runs the binary and checks the fingerprint it reports
        # against the manifest. Measured against the published viprs.1
        # archive it fails with `Library not loaded: @rpath/viprs_acadsharp.dylib`
        # and exit 134; against the same bytes with the name corrected it
        # passes.
        #
        # Between Verify and Upload, like the linux consumers: an archive
        # that cannot be linked stays off the release page rather than
        # being explained afterwards.
        #
        # This is not the only place the recipe runs any more, and the
        # argument that it had to be is wrong. It ran: "folding it into
        # verify_archive.sh would fail on every synthetic Mach-O fixture
        # in tests/test_verify_archive.py, and gating it on 'is this
        # library real' is a gate with no honest predicate." The honest
        # predicate exists and it is not about the library: run the recipe
        # when the host matches the archive's platform and cpu, cargo is
        # present, and the caller asked for it with
        # VIPRS_REQUIRE_LINK_TEST=1. The hand-assembled fixtures satisfy
        # none of those, the release lane and
        # verify_archive_matched_host.sh satisfy all three. So the recipe
        # now lives outside the `static_certified` gate in the script too,
        # which is what makes VIPRS_REQUIRE_LINK_TEST refuse a mac archive
        # rather than print a line about one -- a flag that cannot refuse
        # is the bug the wrapper's own header says this repo stopped
        # accepting.
        #
        # This step stays because it is the only one that runs the recipe
        # against the unpacked tree a consumer actually downloads, between
        # Verify and Upload, and because two checks of the same fact in
        # two lanes is the arrangement #95 argued for.
        run: |
          bash acadsharp/scripts/link_consumer_smoke.sh \
            "bin/unpacked/acadsharp-${{ matrix.platform }}-${{ matrix.cpu }}"

      - name: Upload release asset ${{ matrix.platform }}/${{ matrix.cpu }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-version.outputs.tag }}
        run: |
          gh release upload "$TAG" \
            "bin/acadsharp-${{ matrix.platform }}-${{ matrix.cpu }}.tgz" --clobber

      - name: Keep the build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.platform }}-${{ matrix.cpu }}
          path: bin/logs/
          if-no-files-found: warn

  release-notes:
    # Runs whatever happened above, because a partial publish is exactly
    # the case it exists to report. A release that quietly ships four of
    # five targets is worse than one that ships four and says so, so the
    # notes are rewritten from what is actually on the release page
    # rather than from what the jobs claim.
    needs: [resolve-version, create-release, build-linux, build-mac]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the notes preamble
        if: needs.create-release.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: release-notes-preamble

      - name: Download whatever published
        if: needs.create-release.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-version.outputs.tag }}
        run: |
          set -eu
          mkdir -p assets
          # A release with nothing on it yet is a normal outcome of a run
          # where every cell failed, and the notes still have to be
          # written for it.
          gh release download "$TAG" --dir assets --pattern 'acadsharp-*.tgz' || true
          ls -l assets || true

      - name: Write the release notes
        if: needs.create-release.result == 'success'
        # TARGETS is the one place this workflow repeats its own matrix,
        # because a job with no strategy of its own cannot read the cells
        # of the jobs it waits on.
        # acadsharp/tests/test_release_workflow.py compares this list
        # against both build matrices, so the copy cannot drift.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-version.outputs.tag }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
          LINUX_RESULT: ${{ needs.build-linux.result }}
          MAC_RESULT: ${{ needs.build-mac.result }}
          TARGETS: |
            linux x64 build-linux
            linux arm64 build-linux
            musl x64 build-linux
            musl arm64 build-linux
            mac arm64 build-mac
        run: |
          set -eu
          cp release-notes.md notes.md
          python3 - >> notes.md <<'PY'
          import hashlib
          import json
          import os
          import tarfile

          results = {
              "build-linux": os.environ.get("LINUX_RESULT", "unknown"),
              "build-mac": os.environ.get("MAC_RESULT", "unknown"),
          }

          def digest(path):
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(1 << 20), b""):
                      h.update(chunk)
              return h.hexdigest()

          def linkinfo(path, stem):
              """metadata/LINKINFO.json out of the archive, or None."""
              try:
                  with tarfile.open(path) as tf:
                      member = tf.extractfile(f"{stem}/metadata/LINKINFO.json")
                      if member is None:
                          return None
                      return json.loads(member.read().decode())
              except (KeyError, OSError, ValueError):
                  return None

          version = os.environ["VERSION"]
          published, missing, refused, commits = [], [], [], set()
          # The AC10xx range each archive recorded when its own build
          # asked the library it was about to pack. Keyed by the pair, so
          # a disagreement names both ranges and the archives on each
          # side of it.
          ranges = {}
          for line in os.environ["TARGETS"].split("\n"):
              line = line.split()
              if not line:
                  continue
              platform, cpu, job = line
              stem = f"acadsharp-{platform}-{cpu}"
              path = os.path.join("assets", f"{stem}.tgz")
              if not os.path.exists(path):
                  missing.append((platform, cpu, job))
                  continue
              info = linkinfo(path, stem) or {}

              # An archive whose manifest disagrees with the tag it is
              # being published under is worse than a missing one: it
              # looks right. An absent artifact_version is the same
              # refusal, because "cannot be checked" is not "checked".
              built = info.get("artifact_version")
              if built != version:
                  refused.append(
                      {
                          "archive": f"{stem}.tgz",
                          "platform": platform,
                          "cpu": cpu,
                          "job": job,
                          "built": built or "no artifact_version in LINKINFO.json",
                      }
                  )
                  continue

              if info.get("acadsharp_commit"):
                  commits.add(info["acadsharp_commit"])
              pair = (info.get("dwg_version_min"), info.get("dwg_version_max"))
              ranges.setdefault(pair, []).append(f"{stem}.tgz")
              published.append(
                  {
                      "archive": f"{stem}.tgz",
                      "target": info.get("target", "unrecorded"),
                      "static": info.get("static_certified"),
                      "sha256": digest(path),
                  }
              )

          # Named for the shell below, which removes them from the release
          # and then fails the run.
          with open("refused-assets.txt", "w") as f:
              for row in refused:
                  f.write(row["archive"] + "\n")

          # The read range, as the archives on this page state it. Five
          # archives are five builds of one shim, so one range or the
          # release is not one artifact in five shapes. No asset is
          # removed on a disagreement: with the manifests contradicting
          # each other there is nothing to say which of them is wrong, so
          # the page reports what was found and the run goes red.
          range_problem = ""
          if published:
              # Sorted through a key, because a stale asset can carry no
              # range at all, and in Python a tuple holding None does not
              # compare with a tuple holding integers. Without this the
              # generator raises TypeError over exactly the archive it
              # exists to report.
              pairs = sorted(ranges, key=lambda p: tuple(-1 if v is None else v for v in p))
              unusable = [p for p in pairs if not all(isinstance(v, int) for v in p)]
              if len(pairs) > 1:
                  range_problem = "the published archives do not agree on the DWG read range"
              elif unusable:
                  range_problem = "a published archive records no read range"

          if commits:
              print()
              print(f"- ACadSharp commit: `{', '.join(sorted(commits))}`")

          if published and not range_problem:
              low, high = pairs[0]
              print(f"- DWG read range: AC{low} to AC{high}, inclusive")
              print()
              print(
                  "Read out of every published archive's metadata/LINKINFO.json, which "
                  "records what that archive's own library answered when it was asked."
              )

          print()
          print("## Archives")
          print()
          if published:
              print("| archive | rust target | static_certified | sha256 |")
              print("| --- | --- | --- | --- |")
              for row in published:
                  static = "unrecorded" if row["static"] is None else str(row["static"]).lower()
                  print(
                      f"| `{row['archive']}` | `{row['target']}` | {static} | "
                      f"`{row['sha256']}` |"
                  )
          else:
              print("Nothing published.")

          print()
          if refused:
              print("## Archives refused")
              print()
              for row in refused:
                  print(
                      f"- `{row['archive']}` did not publish (job `{row['job']}`): it was "
                      f"built as {row['built']}, and this release is {version}. "
                      "The asset has been removed from this release."
                  )
              print()
              print(
                  "An archive whose LINKINFO.json disagrees with the tag it is "
                  "published under is worse than one that is missing, because it "
                  "looks right. The run is failed rather than left standing."
              )
              print()

          if range_problem:
              print()
              print("## DWG read range")
              print()
              print(f"{range_problem}. Each archive records the range its own library")
              print("answered with during its build, so these are five measurements of")
              print("what is on this page:")
              print()
              for pair in pairs:
                  low, high = pair
                  if all(isinstance(v, int) for v in pair):
                      what = f"AC{low} to AC{high}"
                  else:
                      what = "no read range in LINKINFO.json"
                  print(f"- {what}: {', '.join(sorted(ranges[pair]))}")
              print()
              print(
                  "Nothing has been removed from the release: with the manifests "
                  "contradicting each other there is no way to say which is wrong. "
                  "The run is failed so somebody looks."
              )
              print()

          # Named for the shell below, which fails the run on it.
          with open("range-disagreement.txt", "w") as f:
              f.write(range_problem + "\n" if range_problem else "")

          if missing or refused:
              if missing:
                  print("## Targets that did not publish")
                  print()
                  for platform, cpu, job in missing:
                      print(f"- `{platform}/{cpu}` did not publish (job `{job}`, {results[job]})")
                  print()
              print(
                  "This release is incomplete. Re-run the failed job; uploads use "
                  "`--clobber`, so a re-run replaces its own assets."
              )
          else:
              print("Every target published.")

          print()
          print("Archive rows are read from each published archive's")
          print("metadata/LINKINFO.json and hashed from the asset itself.")
          PY
          cat notes.md
          gh release edit "$TAG" --notes-file notes.md

          # The notes go up first, so the release page says what happened
          # even though the step is about to fail. Then the offending
          # assets come off, and the run goes red: a release carrying an
          # archive that disagrees with its own tag is not a release worth
          # leaving standing.
          if [ -s refused-assets.txt ]; then
            while read -r asset; do
              echo "removing $asset: its artifact_version is not $VERSION" >&2
              gh release delete-asset "$TAG" "$asset" --yes
            done < refused-assets.txt
            exit 1
          fi

          # A read-range disagreement removes nothing and still fails: the
          # notes above name every range that was found and which archives
          # carry it, which is what somebody needs to work out which build
          # is the odd one.
          if [ -s range-disagreement.txt ]; then
            cat range-disagreement.txt >&2
            exit 1
          fi

      - name: Emit the run summary
        if: always()
        env:
          TAG: ${{ needs.resolve-version.outputs.tag }}
        run: |
          set -eu
          URL="https://github.com/${{ github.repository }}/releases/tag/$TAG"
          {
            echo "## acadsharp release: \`$TAG\`"
            echo ""
            echo "Release URL: $URL"
            echo ""
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| resolve-version | ${{ needs.resolve-version.result }} |"
            echo "| create-release  | ${{ needs.create-release.result }} |"
            echo "| build-linux     | ${{ needs.build-linux.result }} |"
            echo "| build-mac       | ${{ needs.build-mac.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-latest:
    # Moves acadsharp-latest onto whatever this run just published, so a
    # consumer tracking the edge of this dependency has one URL that
    # never needs to resolve a version. Only when every target
    # published: a "latest" that can point at a partial release is worse
    # than none, because a consumer tracking edge would silently start
    # missing whichever target happened to fail. Every dependency's
    # release workflow in this repo carries an identical job, calling
    # the same shared script with its own dependency name and asset glob.
    needs: [resolve-version, build-linux, build-mac, release-notes]
    if: needs.build-linux.result == 'success' && needs.build-mac.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Move acadsharp-latest to this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-version.outputs.tag }}
        run: tools/publish_latest_tag.sh acadsharp "$TAG" 'acadsharp-*.tgz'
